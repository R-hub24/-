<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دامەی کوردی - حاجی و یارییەکەی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #1e110b 0%, #3d2314 100%);
            color: #fdfefe;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-template-rows: repeat(8, minmax(0, 1fr));
            background-color: #4a2511;
            border: 6px solid #b8860b;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            aspect-ratio: 1;
        }

        .square.light { background-color: #dfb17b; }
        .square.dark { background-color: #8c5830; }

        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5), inset 0 3px 5px rgba(255,255,255,0.4);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .piece.red { background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b); color: white; border: 2px solid #962d22; }
        .piece.blue { background: radial-gradient(circle at 30% 30%, #54a0ff, #2e86de); color: white; border: 2px solid #1b4f72; }
        .piece.green { background: radial-gradient(circle at 30% 30%, #1dd1a1, #10ac84); color: white; border: 2px solid #0e6655; }
        .piece.purple { background: radial-gradient(circle at 30% 30%, #9b59b6, #8e44ad); color: white; border: 2px solid #512e5f; }

        .piece.ai-piece {
            background: radial-gradient(circle at 30% 30%, #f1c40f, #d4ac0d);
            color: #2c3e50;
            border: 2px solid #b7950b;
        }

        .piece.king::after {
            content: '👑';
            font-size: 1.2rem;
            position: absolute;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .piece.selected {
            transform: scale(1.15);
            box-shadow: 0 0 15px 4px #ffffff, 0 5px 10px rgba(0,0,0,0.5);
        }

        .highlight::after {
            content: '';
            width: 25%;
            height: 25%;
            background-color: rgba(46, 204, 113, 0.9);
            border-radius: 50%;
            position: absolute;
            z-index: 20;
            box-shadow: 0 0 8px #2ecc71;
        }

        .tea-master-box {
            background: linear-gradient(to bottom, #2b170e, #1a0e08);
            border: 3px solid #d4ac0d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- Setup Form Modal (فۆرمی سەرەتایی چوونە ژوورەوە) -->
    <div id="setupModal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-[#2b170e] border-4 border-amber-400 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl text-right">
            <div class="text-center mb-6">
                <!-- ئیمۆجیی بێ جێندەر: پیاوی جامانەبەسەر لەگەڵ پیالەی چا -->
                <div class="text-5xl mb-2">🧔☕</div>
                <h2 class="text-2xl font-extrabold text-amber-300">بەخێرهاتیت بۆ ناو مەیدانەکەی حاجی</h2>
                <p class="text-xs text-amber-100/70 mt-1">تکایە زانیارییەکان پڕبکەرەوە تا دەست پێبکەین</p>
            </div>

            <!-- ناو -->
            <div class="mb-4">
                <label class="block text-xs font-bold text-amber-200 mb-1.5">ناوی خۆت:</label>
                <input type="text" id="inputPlayerName" value="یاریزان" class="w-full bg-black/40 border border-amber-500/50 rounded-xl px-4 py-2.5 text-amber-100 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <!-- ئاستی یاری -->
            <div class="mb-4">
                <label class="block text-xs font-bold text-amber-200 mb-1.5">ئاستی یاریکردن:</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="selectSetupDiff(1, this)" class="diff-btn py-2 rounded-xl text-xs font-bold border border-amber-700/50 bg-amber-900/30 text-amber-300 transition hover:bg-amber-800">ئاسان</button>
                    <button type="button" onclick="selectSetupDiff(2, this)" class="diff-btn py-2 rounded-xl text-xs font-bold border border-amber-400 bg-amber-600 text-amber-950 shadow transition active">ناوەند</button>
                    <button type="button" onclick="selectSetupDiff(4, this)" class="diff-btn py-2 rounded-xl text-xs font-bold border border-amber-700/50 bg-amber-900/30 text-amber-300 transition hover:bg-amber-800">قورس</button>
                </div>
            </div>

            <!-- جۆری بەرد -->
            <div class="mb-6">
                <label class="block text-xs font-bold text-amber-200 mb-1.5">رەنگی بەردەکەت:</label>
                <div class="grid grid-cols-4 gap-2">
                    <button type="button" onclick="selectPieceColor('red', this)" class="color-btn py-2.5 rounded-xl text-xs font-bold border-2 border-white bg-red-600 text-white shadow">سوور</button>
                    <button type="button" onclick="selectPieceColor('blue', this)" class="color-btn py-2.5 rounded-xl text-xs font-bold border border-amber-700/50 bg-blue-600 text-white">شین</button>
                    <button type="button" onclick="selectPieceColor('green', this)" class="color-btn py-2.5 rounded-xl text-xs font-bold border border-amber-700/50 bg-emerald-600 text-white">سەوز</button>
                    <button type="button" onclick="selectPieceColor('purple', this)" class="color-btn py-2.5 rounded-xl text-xs font-bold border border-amber-700/50 bg-purple-600 text-white">مۆر</button>
                </div>
            </div>

            <button onclick="startGameFromModal()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-amber-950 font-extrabold py-3 rounded-xl shadow-lg text-base transition transform active:scale-95">
                دەستپێکردنی یارییەکە 🚀
            </button>
        </div>
    </div>

    <!-- Win / Message Modal -->
    <div id="winModal" class="fixed inset-0 bg-black/85 z-50 hidden items-center justify-center p-4">
        <div class="bg-[#2b170e] border-4 border-amber-400 rounded-2xl p-6 max-w-md w-full shadow-2xl text-center">
            <h2 class="text-3xl font-extrabold text-amber-300 mb-2">🎉 پیرۆزە!</h2>
            <p id="winMessage" class="text-sm text-amber-100 mb-4">یارییەکە تەواو بوو!</p>
            <button onclick="location.reload()" class="w-full bg-amber-600 hover:bg-amber-500 text-amber-950 font-bold py-2.5 rounded-xl shadow transition">
                دووبارە یاریکردنەوە 🔄
            </button>
        </div>
    </div>

    <!-- Haji AI Box -->
    <div class="w-full max-w-xl mb-4 tea-master-box p-4 flex items-center gap-4">
        <div class="text-4xl bg-amber-900/60 p-3 rounded-full border border-amber-600 shadow-inner flex-shrink-0 flex items-center justify-center">
            🧔☕
        </div>
        <div class="flex-grow">
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-amber-400 font-semibold uppercase tracking-wider">حاجی (شیکارکاری بازار و چایچی)</span>
                <span id="displayActiveLevel" class="text-xs bg-amber-900/80 text-amber-200 px-2 py-0.5 rounded border border-amber-700 font-bold">ئاست: ناوەند</span>
            </div>
            <p id="aiComment" class="text-sm italic text-amber-100 min-h-[40px] leading-relaxed">
                "خێراکە ڕۆڵە، دەست پێبکە با سەیری بازنەی جووڵەت بکەین!"
            </p>
        </div>
    </div>

    <!-- Main Board Container -->
    <div class="w-full max-w-xl flex flex-col items-center bg-[#3d2314] p-4 sm:p-6 rounded-2xl shadow-2xl border-4 border-[#b8860b]">
        <div class="flex justify-between w-full items-center mb-4 px-2">
            <div id="status" class="text-sm sm:text-base font-bold bg-black/40 px-4 py-1.5 rounded-full border border-amber-500/50 text-amber-200 shadow-inner">
                نۆرەی: خۆت
            </div>
            <div class="flex gap-2">
                <button onclick="location.reload()" class="bg-amber-600 hover:bg-amber-500 text-amber-950 font-bold px-3 py-1.5 rounded-lg shadow text-xs transition active:scale-95">
                    سەرتاوە دەستپێکردنەوە
                </button>
            </div>
        </div>

        <div id="board" class="board-grid w-full max-w-[420px]"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxEUwAIpbvtH19hQBVeYkVqPPLOwVPxLiEBAHUqKZCBsucMN57Eoj9IKbfim-uK4dL5/exec";

        let board = [];
        let turn = 1;
        let selectedPiece = null;
        let validMoves = [];
        let isAiThinking = false;
        
        let playerName = "یاریزان";
        let aiDepth = 2;
        let playerColorClass = "red";

        const hajiComments = {
            playerMove: [
                "ماشەڵڵا ڕۆڵە، جووڵەیەکی باش بوو، سەهۆڵەکە بەم ڕیتمە گەرم دەبێت!",
                "بەڕاستی هۆشیارت! جووڵەیەکی پاک و سەرنجڕاکێش بوو.",
                "ئۆهو! هەنگاوێکی وشیارانە بوو، حاجی پێم سەرسام بوو.",
                "دەستت خۆش بێت، وەک یاریزانێکی زیرەک جووڵایت."
            ],
            playerCapture: [
                "بەخوا بەردەکەی بەزاند! چاو نەترسانە لێیدا.",
                "ڕاوچییەکی ڕاستەقینەی! بەردەکەت خوارد و سڕیەتەوە.",
                "ئەمەیە لێهاتوویی! حاجی چاییەکت بۆ تێدەكات لەسەر ئەم გამە."
            ],
            aiMove: [
                "حاجی ئێستا نۆبەیەتی، سەیری ئەم فێڵە بکە!",
                "باوەڕ بکە لەم بازی دامەیەدا ئەم جووڵەیەم زۆر بینیوە.",
                "حاجی بە ئارامی بیر دەکاتەوە، سەیرەکە چۆن دەجووڵێم!",
                "جووڵەیەکی توند بوو، خۆت بپارێزە!"
            ],
            aiCapture: [
                "ئیشم پێکردی ڕۆڵە! حاجی بەردەکەی خوارد.",
                "تۆ لەبیرت کرد بەرگری بکەیت، حاجی لێی بردیت!",
                "وەها لێم دا کە دەنگ بداتەوە!"
            ],
            kingMade: [
                "پیرۆزە! بەردەکەت بوو بە تاجدار (پاشا)، ئێستا دەسەڵاتت لە یارییەکەدا گەورەتر بوو.",
                "تاجت نا لەسەر سەر، وەک پاڵەوانی پلە یەک!"
            ]
        };

        function selectSetupDiff(depth, btn) {
            aiDepth = depth;
            document.querySelectorAll('.diff-btn').forEach(b => {
                b.className = "diff-btn py-2 rounded-xl text-xs font-bold border border-amber-700/50 bg-amber-900/30 text-amber-300 transition hover:bg-amber-800";
            });
            btn.className = "diff-btn py-2 rounded-xl text-xs font-bold border border-amber-400 bg-amber-600 text-amber-950 shadow transition";
        }

        function selectPieceColor(color, btn) {
            playerColorClass = color;
            document.querySelectorAll('.color-btn').forEach(b => {
                b.className = "color-btn py-2.5 rounded-xl text-xs font-bold border border-amber-700/50 text-white";
                b.style.border = "1px solid rgba(180, 130, 50, 0.5)";
            });
            btn.style.border = "2px solid white";
            btn.className += " shadow";
        }

        function sendDataToGoogleSheet(name, diff, color) {
            let diffText = diff === 1 ? "ئاسان" : (diff === 2 ? "ناوەند" : "قورس");
            let formData = {
                playerName: name,
                difficulty: diffText,
                pieceColor: color
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                console.log("زانیارییەکان بە سەرکەوتوویی نێرران بۆ گوگل شیت!");
            })
            .catch(error => {
                console.error("هەڵە لە ناردنی زانیاری:", error);
            });
        }

        function startGameFromModal() {
            let nameInput = document.getElementById('inputPlayerName').value.trim();
            if(nameInput) playerName = nameInput;

            sendDataToGoogleSheet(playerName, aiDepth, playerColorClass);

            document.getElementById('setupModal').style.display = 'none';

            let diffText = aiDepth === 1 ? "ئاسان" : (aiDepth === 2 ? "ناوەند" : "قورس");
            document.getElementById('displayActiveLevel').innerText = `ئاست: ${diffText}`;

            initBoard();
            setHajiMessage(`بەخێرهاتیت بۆ ناو مەیدانەکەی حاجی، ڕۆڵە (${playerName})! نۆبەی تۆیە، بەردەکەت بجووڵێنە.`);
            updateStatus();
        }

        function getRandomComment(type) {
            const list = hajiComments[type];
            return list[Math.floor(Math.random() * list.length)];
        }

        function setHajiMessage(msg) {
            document.getElementById('aiComment').innerText = `"${msg}"`;
        }

        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(0));
            for (let r = 1; r <= 2; r++) {
                for (let c = 0; c < 8; c++) { board[r][c] = { player: 2, king: false }; }
            }
            for (let r = 5; r <= 6; r++) {
                for (let c = 0; c < 8; c++) { board[r][c] = { player: 1, king: false }; }
            }
            turn = 1;
            selectedPiece = null;
            validMoves = [];
            isAiThinking = false;
            updateStatus();
            renderBoard();
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    square.classList.add((r + c) % 2 === 0 ? 'light' : 'dark');

                    const piece = board[r][c];
                    if (piece !== 0) {
                        const pieceEl = document.createElement('div');
                        if (piece.player === 1) {
                            pieceEl.classList.add('piece', playerColorClass);
                        } else {
                            pieceEl.classList.add('piece', 'ai-piece');
                        }
                        if (piece.king) pieceEl.classList.add('king');
                        if (selectedPiece && selectedPiece.row === r && selectedPiece.col === c) {
                            pieceEl.classList.add('selected');
                        }
                        square.appendChild(pieceEl);
                    }

                    if (turn === 1 && !isAiThinking && validMoves.some(m => m.r === r && m.c === c)) {
                        square.classList.add('highlight');
                    }

                    square.addEventListener('click', () => {
                        if (turn === 1 && !isAiThinking) handleSquareClick(r, c);
                    });
                    boardElement.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            const piece = board[r][c];
            if (piece !== 0 && piece.player === turn) {
                selectedPiece = { row: r, col: c };
                validMoves = getValidMovesForPiece(r, c, board);
                renderBoard();
                return;
            }

            const move = validMoves.find(m => m.r === r && m.c === c);
            if (move) {
                executeMoveAndSwitch(selectedPiece.row, selectedPiece.col, move.r, move.c, move.captured, 1);
            }
        }

        function getValidMovesForPiece(r, c, currentBoard) {
            let moves = [];
            const piece = currentBoard[r][c];
            if (piece === 0) return moves;

            const directions = [
                { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
                { dr: 0, dc: -1 }, { dr: 0, dc: 1 }
            ];

            directions.forEach(d => {
                if (!piece.king) {
                    if (piece.player === 1 && d.dr === 1) return;
                    if (piece.player === 2 && d.dr === -1) return;
                }

                const nextR = r + d.dr;
                const nextC = c + d.dc;
                if (isValidCoord(nextR, nextC)) {
                    if (currentBoard[nextR][nextC] === 0) {
                        moves.push({ r: nextR, c: nextC, captured: null, fromR: r, fromC: c });
                    } else if (currentBoard[nextR][nextC].player !== piece.player) {
                        const jumpR = nextR + d.dr;
                        const jumpC = nextC + d.dc;
                        if (isValidCoord(jumpR, jumpC) && currentBoard[jumpR][jumpC] === 0) {
                            moves.push({ r: jumpR, c: jumpC, captured: { r: nextR, c: nextC }, fromR: r, fromC: c });
                        }
                    }
                }
            });

            if (piece.king) {
                directions.forEach(d => {
                    let steps = 1;
                    let blocked = false;
                    while (true) {
                        const nextR = r + d.dr * steps;
                        const nextC = c + d.dc * steps;
                        if (!isValidCoord(nextR, nextC)) break;

                        if (currentBoard[nextR][nextC] === 0) {
                            if (!blocked) {
                                moves.push({ r: nextR, c: nextC, captured: null, fromR: r, fromC: c });
                            }
                        } else {
                            if (currentBoard[nextR][nextC].player !== piece.player && !blocked) {
                                const jumpR = nextR + d.dr;
                                const jumpC = nextC + d.dc;
                                if (isValidCoord(jumpR, jumpC) && currentBoard[jumpR][jumpC] === 0) {
                                    moves.push({ r: jumpR, c: jumpC, captured: { r: nextR, c: nextC }, fromR: r, fromC: c });
                                }
                            }
                            blocked = true;
                        }
                        steps++;
                    }
                });
            }

            return moves;
        }

        function getAllPossibleMoves(player, currentBoard) {
            let allMoves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (currentBoard[r][c] !== 0 && currentBoard[r][c].player === player) {
                        let pMoves = getValidMovesForPiece(r, c, currentBoard);
                        allMoves.push(...pMoves);
                    }
                }
            }
            allMoves.sort((a, b) => (b.captured ? 1 : 0) - (a.captured ? 1 : 0));
            return allMoves;
        }

        function isValidCoord(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
        function cloneBoard(b) { return b.map(row => row.map(cell => cell === 0 ? 0 : { ...cell })); }

        function executeMoveAndSwitch(fromR, fromC, toR, toC, captured, playerNum) {
            const piece = board[fromR][fromC];
            board[fromR][fromC] = 0;
            board[toR][toC] = piece;

            let wasCapture = false;
            if (captured) {
                board[captured.r][captured.c] = 0;
                wasCapture = true;
            }

            let becameKing = false;
            if (piece.player === 1 && toR === 0 && !piece.king) { piece.king = true; becameKing = true; }
            if (piece.player === 2 && toR === 7 && !piece.king) { piece.king = true; becameKing = true; }

            selectedPiece = null;
            validMoves = [];
            
            turn = playerNum === 1 ? 2 : 1;
            updateStatus();
            renderBoard();
            
            if (becameKing) {
                setHajiMessage(getRandomComment('kingMade'));
            } else if (wasCapture) {
                setHajiMessage(getRandomComment('playerCapture'));
            } else {
                setHajiMessage(getRandomComment('playerMove'));
            }

            let aiMoves = getAllPossibleMoves(2, board);
            if (aiMoves.length === 0 && turn === 2) {
                showWinModal(`🎉 پیرۆزە ${playerName}! تۆ سەرکەوتوو بوویت و یارییەکەت بردەوە!`);
                return;
            }

            if (turn === 2) {
                isAiThinking = true;
                document.getElementById('status').innerText = "حاجی خەریکی بیرکردنەوەیە...";
                setTimeout(makeAiMove, 700);
            }
        }

        function showWinModal(msg) {
            document.getElementById('winMessage').innerText = msg;
            document.getElementById('winModal').style.display = 'flex';
        }

        function endGame(msg) {
            document.getElementById('status').innerText = msg;
            setHajiMessage(`«${msg} جارێکی تر تاقی بکەرەوە ڕۆڵە!»`);
        }

        function updateStatus() {
            document.getElementById('status').innerText = `نۆرەی: ${turn === 1 ? playerName + ' (تۆ)' : 'حاجی (زەرد)'}`;
        }

        function makeAiMove() {
            let possibleMoves = getAllPossibleMoves(2, board);
            if (possibleMoves.length === 0) {
                showWinModal(`🎉 پیرۆزە ${playerName}! حاجی بێچارە بوو و تۆ بردتەوە!`);
                isAiThinking = false;
                return;
            }

            let bestMove = null;
            let bestScore = -Infinity;
            possibleMoves.sort(() => Math.random() - 0.5);

            for (let move of possibleMoves) {
                let tempBoard = cloneBoard(board);
                applyMoveToTemp(tempBoard, move);
                let score = minimax(tempBoard, aiDepth, false, -Infinity, Infinity);
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }

            isAiThinking = false;
            if (bestMove) {
                let capturedObj = bestMove.captured;
                let wasCapture = capturedObj !== null;
                const piece = board[bestMove.fromR][bestMove.fromC];
                board[bestMove.fromR][bestMove.fromC] = 0;
                board[bestMove.r][bestMove.c] = piece;

                if (capturedObj) board[capturedObj.r][capturedObj.c] = 0;
                if (piece.player === 2 && bestMove.r === 7) piece.king = true;

                turn = 1;
                updateStatus();
                renderBoard();

                if (wasCapture) {
                    setHajiMessage(getRandomComment('aiCapture'));
                } else {
                    setHajiMessage(getRandomComment('aiMove'));
                }

                let playerMoves = getAllPossibleMoves(1, board);
                if (playerMoves.length === 0) {
                    endGame("حاجی بردیەوە!");
                }
            }
        }

        function applyMoveToTemp(b, move) {
            const piece = b[move.fromR][move.fromC];
            b[move.fromR][move.fromC] = 0;
            b[move.r][move.c] = piece;
            if (move.captured) b[move.captured.r][move.captured.c] = 0;
            if (piece.player === 1 && move.r === 0) piece.king = true;
            if (piece.player === 2 && move.r === 7) piece.king = true;
        }

        function minimax(b, depth, maximizingPlayer, alpha, beta) {
            if (depth === 0) return evaluateBoard(b);
            let currentPlayer = maximizingPlayer ? 2 : 1;
            let moves = getAllPossibleMoves(currentPlayer, b);
            if (moves.length === 0) return maximizingPlayer ? -10000 : 10000;

            if (maximizingPlayer) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    let nextB = cloneBoard(b);
                    applyMoveToTemp(nextB, move);
                    let evaluation = minimax(nextB, depth - 1, false, alpha, beta);
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    let nextB = cloneBoard(b);
                    applyMoveToTemp(nextB, move);
                    let evaluation = minimax(nextB, depth - 1, true, alpha, beta);
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluateBoard(b) {
            let score = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let p = b[r][c];
                    if (p !== 0) {
                        let val = 10;
                        if (p.king) val = 30;
                        if (p.player === 2) {
                            val += (r * 1.5);
                            score += val;
                        } else {
                            val += ((7 - r) * 1.5);
                            score -= val;
                        }
                    }
                }
            }
            return score;
        }
    </script>
