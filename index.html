<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دامەی کوردی - مامە چایچی و زیرەکی دەستکرد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #1e110b 0%, #3d2314 100%);
            color: #fdfefe;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-template-rows: repeat(8, minmax(0, 1fr));
            background-color: #4a2511;
            border: 6px solid #b8860b;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            aspect-ratio: 1;
        }

        .square.light { background-color: #dfb17b; }
        .square.dark { background-color: #8c5830; }

        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5), inset 0 3px 5px rgba(255,255,255,0.4);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .piece.red {
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            color: white;
            border: 2px solid #962d22;
        }

        .piece.green {
            background: radial-gradient(circle at 30% 30%, #2ecc71, #27ae60);
            color: white;
            border: 2px solid #1e8449;
        }

        .piece.ai-piece {
            background: radial-gradient(circle at 30% 30%, #f1c40f, #d4ac0d);
            color: #2c3e50;
            border: 2px solid #b7950b;
        }

        .piece.king::after {
            content: '👑';
            font-size: 1.2rem;
            position: absolute;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .piece.selected {
            transform: scale(1.15);
            box-shadow: 0 0 15px 4px #ffffff, 0 5px 10px rgba(0,0,0,0.5);
        }

        .highlight::after {
            content: '';
            width: 25%;
            height: 25%;
            background-color: rgba(46, 204, 113, 0.9);
            border-radius: 50%;
            position: absolute;
            z-index: 20;
            box-shadow: 0 0 8px #2ecc71;
        }

        .tea-master-box {
            background: linear-gradient(to bottom, #2b170e, #1a0e08);
            border: 3px solid #d4ac0d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- Registration Overlay / Modal -->
    <div id="regModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-[#2b170e] border-4 border-amber-600 rounded-2xl p-6 max-w-md w-full shadow-2xl text-center">
            <h2 class="text-2xl font-bold text-amber-300 mb-2">☕ بەخێر هاتیت بۆ دامەی کوردی</h2>
            <p class="text-xs text-amber-200/80 mb-6">تکایە ناوی خۆت بنووسە و ڕەنگ و ئاستی یارییەکە هەڵبژێرە با ناوت لە تۆمارەکاندا (Google Sheets) هەڵبگیرێت.</p>
            
            <div class="space-y-4 text-right">
                <div>
                    <label class="block text-xs text-amber-400 mb-1 font-semibold">ناوی یاریزان:</label>
                    <input type="text" id="playerName" class="w-full bg-[#1f100a] border border-amber-600 rounded-lg px-3 py-2 text-sm text-amber-100 focus:outline-none focus:border-amber-400" placeholder="ناوی خۆت بنووسە...">
                </div>

                <div>
                    <label class="block text-xs text-amber-400 mb-1 font-semibold">هەڵبژاردنی ڕەنگی بەردەکانت:</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer bg-black/30 px-3 py-2 rounded-lg border border-amber-900 flex-1 justify-center">
                            <input type="radio" name="playerColor" value="red" checked class="accent-red-500">
                            <span class="text-sm font-bold text-red-400">سوور ❤</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer bg-black/30 px-3 py-2 rounded-lg border border-amber-900 flex-1 justify-center">
                            <input type="radio" name="playerColor" value="green" class="accent-green-500">
                            <span class="text-sm font-bold text-green-400">سەوز 💚</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-amber-400 mb-1 font-semibold">ئاستی زیرەکی دەستکرد:</label>
                    <select id="aiDifficulty" class="w-full bg-[#1f100a] border border-amber-600 rounded-lg px-3 py-2 text-sm text-amber-100 focus:outline-none focus:border-amber-400">
                        <option value="medium">مامناوەند (Easy/Medium)</option>
                        <option value="hard" selected>قورس (Minimax - Advanced)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-amber-400 mb-1 font-semibold">کلیلی Gemini API (بۆ قسەکردنی مامە چایچی):</label>
                    <input type="password" id="modalApiKey" class="w-full bg-[#1f100a] border border-amber-600 rounded-lg px-3 py-2 text-sm text-amber-100" placeholder="API Key...">
                </div>

                <button onclick="startTheGame()" class="w-full bg-amber-600 hover:bg-amber-500 text-amber-950 font-bold py-3 rounded-xl shadow-lg transition mt-4">
                    دەستپێکردنی یارییەکە 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- Tea Master AI Box -->
    <div class="w-full max-w-xl mb-4 tea-master-box p-4 flex items-center gap-4">
        <div class="text-4xl bg-amber-900/60 p-3 rounded-full border border-amber-600 shadow-inner flex-shrink-0">
            👴☕
        </div>
        <div class="flex-grow">
            <div class="flex justify-between items-center mb-1">
                <span id="masterTitle" class="text-xs text-amber-400 font-semibold uppercase tracking-wider">مامە چایچی (شرۆڤەکاری فۆلکلۆر)</span>
                <span id="displayDifficulty" class="text-xs bg-red-900/80 text-red-200 px-2 py-0.5 rounded border border-red-700 font-bold">ئاست: قورس</span>
            </div>
            <p id="aiComment" class="text-sm italic text-amber-100 min-h-[40px] leading-relaxed">
                "سڵاو ڕۆڵە! چایەکەت داگیرسێنە و با دەست پێبکەین!"
            </p>
        </div>
    </div>

    <!-- Main Board Container -->
    <div class="w-full max-w-xl flex flex-col items-center bg-[#3d2314] p-4 sm:p-6 rounded-2xl shadow-2xl border-4 border-[#b8860b]">
        <div class="flex justify-between w-full items-center mb-4 px-2">
            <div id="status" class="text-sm sm:text-base font-bold bg-black/40 px-4 py-1.5 rounded-full border border-amber-500/50 text-amber-200 shadow-inner">
                نۆرەی: خۆت
            </div>
            <div class="flex gap-2">
                <button onclick="location.reload()" class="bg-amber-600 hover:bg-amber-500 text-amber-950 font-bold px-3 py-1.5 rounded-lg shadow text-xs transition active:scale-95">
                    سەرتاوە دەستپێکردنەوە
                </button>
            </div>
        </div>

        <div id="board" class="board-grid w-full max-w-[420px]"></div>
    </div>

    <script>
        // Google Sheets Web App URL (لینکە نوێیەکە)
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyxVUdwIk1bERTNfacUd_iuDFgy620q72VEe8xnvgI-AWNBW675MkjSnJD14OoQFSL9/exec";

        let playerName = "";
        let playerColor = "red";
        let aiDifficulty = "hard";
        let apiKey = "";

        let board = [];
        let turn = 1;
        let selectedPiece = null;
        let validMoves = [];
        let isAiThinking = false;

        function startTheGame() {
            const nameInput = document.getElementById('playerName').value.trim();
            if (!nameInput) {
                alert("تکایە ناوی یاریزان بنووسە!");
                return;
            }
            playerName = nameInput;
            playerColor = document.querySelector('input[name="playerColor"]:checked').value;
            aiDifficulty = document.getElementById('aiDifficulty').value;
            apiKey = document.getElementById('modalApiKey').value.trim();

            document.getElementById('displayDifficulty').innerText = `ئاست: ${aiDifficulty === 'hard' ? 'قورس' : 'مامناوەند'}`;
            document.getElementById('regModal').style.display = 'none';

            // ناردنی داتا بۆ گوگل شیت
            saveDataToGoogleSheets(playerName, playerColor, aiDifficulty);

            initBoard();
        }

        async function saveDataToGoogleSheets(name, color, diff) {
            if (!GOOGLE_SHEET_URL.includes("script.google.com")) return;
            try {
                await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, color, difficulty: diff, date: new Date().toISOString() })
                });
            } catch (e) {
                console.log("Sheet save error:", e);
            }
        }

        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(0));
            for (let r = 1; r <= 2; r++) {
                for (let c = 0; c < 8; c++) { board[r][c] = { player: 2, king: false }; }
            }
            for (let r = 5; r <= 6; r++) {
                for (let c = 0; c < 8; c++) { board[r][c] = { player: 1, king: false }; }
            }
            turn = 1;
            selectedPiece = null;
            validMoves = [];
            isAiThinking = false;
            updateStatus();
            renderBoard();
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    square.classList.add((r + c) % 2 === 0 ? 'light' : 'dark');

                    const piece = board[r][c];
                    if (piece !== 0) {
                        const pieceEl = document.createElement('div');
                        if (piece.player === 1) {
                            pieceEl.classList.add('piece', playerColor);
                        } else {
                            pieceEl.classList.add('piece', 'ai-piece');
                        }
                        if (piece.king) pieceEl.classList.add('king');
                        if (selectedPiece && selectedPiece.row === r && selectedPiece.col === c) {
                            pieceEl.classList.add('selected');
                        }
                        square.appendChild(pieceEl);
                    }

                    if (turn === 1 && !isAiThinking && validMoves.some(m => m.r === r && m.c === c)) {
                        square.classList.add('highlight');
                    }

                    square.addEventListener('click', () => {
                        if (turn === 1 && !isAiThinking) handleSquareClick(r, c);
                    });
                    boardElement.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            const piece = board[r][c];
            if (piece !== 0 && piece.player === turn) {
                selectedPiece = { row: r, col: c };
                validMoves = getValidMovesForPiece(r, c, board);
                renderBoard();
                return;
            }

            const move = validMoves.find(m => m.r === r && m.c === c);
            if (move) {
                executeMoveAndSwitch(selectedPiece.row, selectedPiece.col, move.r, move.c, move.captured, 1);
            }
        }

        function getValidMovesForPiece(r, c, currentBoard) {
            let moves = [];
            const piece = currentBoard[r][c];
            if (piece === 0) return moves;

            const directions = [
                { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
                { dr: 0, dc: -1 }, { dr: 0, dc: 1 }
            ];

            directions.forEach(d => {
                if (!piece.king) {
                    if (piece.player === 1 && d.dr === 1) return;
                    if (piece.player === 2 && d.dr === -1) return;
                }

                const nextR = r + d.dr;
                const nextC = c + d.dc;
                if (isValidCoord(nextR, nextC)) {
                    if (currentBoard[nextR][nextC] === 0) {
                        moves.push({ r: nextR, c: nextC, captured: null, fromR: r, fromC: c });
                    } else if (currentBoard[nextR][nextC].player !== piece.player) {
                        const jumpR = nextR + d.dr;
                        const jumpC = nextC + d.dc;
                        if (isValidCoord(jumpR, jumpC) && currentBoard[jumpR][jumpC] === 0) {
                            moves.push({ r: jumpR, c: jumpC, captured: { r: nextR, c: nextC }, fromR: r, fromC: c });
                        }
                    }
                }
            });

            if (piece.king) {
                directions.forEach(d => {
                    let steps = 1;
                    let blocked = false;
                    while (true) {
                        const nextR = r + d.dr * steps;
                        const nextC = c + d.dc * steps;
                        if (!isValidCoord(nextR, nextC)) break;

                        if (currentBoard[nextR][nextC] === 0) {
                            if (!blocked) {
                                moves.push({ r: nextR, c: nextC, captured: null, fromR: r, fromC: c });
                            }
                        } else {
                            if (currentBoard[nextR][nextC].player !== piece.player && !blocked) {
                                const jumpR = nextR + d.dr;
                                const jumpC = nextC + d.dc;
                                if (isValidCoord(jumpR, jumpC) && currentBoard[jumpR][jumpC] === 0) {
                                    moves.push({ r: jumpR, c: jumpC, captured: { r: nextR, c: nextC }, fromR: r, fromC: c });
                                }
                            }
                            blocked = true;
                        }
                        steps++;
                    }
                });
            }

            return moves;
        }

        function getAllPossibleMoves(player, currentBoard) {
            let allMoves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (currentBoard[r][c] !== 0 && currentBoard[r][c].player === player) {
                        let pMoves = getValidMovesForPiece(r, c, currentBoard);
                        allMoves.push(...pMoves);
                    }
                }
            }
            allMoves.sort((a, b) => (b.captured ? 1 : 0) - (a.captured ? 1 : 0));
            return allMoves;
        }

        function isValidCoord(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
        function cloneBoard(b) { return b.map(row => row.map(cell => cell === 0 ? 0 : { ...cell })); }

        function executeMoveAndSwitch(fromR, fromC, toR, toC, captured, playerNum) {
            const piece = board[fromR][fromC];
            board[fromR][fromC] = 0;
            board[toR][toC] = piece;

            let wasCapture = false;
            if (captured) {
                board[captured.r][captured.c] = 0;
                wasCapture = true;
            }

            if (piece.player === 1 && toR === 0) piece.king = true;
            if (piece.player === 2 && toR === 7) piece.king = true;

            selectedPiece = null;
            validMoves = [];
            
            turn = playerNum === 1 ? 2 : 1;
            updateStatus();
            renderBoard();
            
            triggerGeminiCommentary(playerNum, wasCapture, piece.king);

            let aiMoves = getAllPossibleMoves(2, board);
            if (aiMoves.length === 0 && turn === 2) {
                endGame(`پیرۆزە ${playerName}! تۆ سەرکەوتوو بوویت!`);
                return;
            }

            if (turn === 2) {
                isAiThinking = true;
                document.getElementById('status').innerText = "کۆمپیوتەر (مامە چایچی) خەریکی بیرکردنەوەیە...";
                let delay = aiDifficulty === 'hard' ? 700 : 400;
                setTimeout(makeAiMove, delay);
            }
        }

        function endGame(msg) {
            document.getElementById('status').innerText = msg;
            document.getElementById('aiComment').innerText = `"${msg} یارییەکی نایاب بوو ئەی ${playerName}!"`;
        }

        function updateStatus() {
            document.getElementById('status').innerText = `نۆرەی: ${turn === 1 ? playerName + ' (' + (playerColor==='red'?'سوور':'سەوز') + ')' : 'کۆمپیوتەر (زەرد)'}`;
        }

        function makeAiMove() {
            let possibleMoves = getAllPossibleMoves(2, board);
            if (possibleMoves.length === 0) {
                endGame(`کۆمپیوتەر بێچارە بوو! ${playerName} بردەوە!`);
                isAiThinking = false;
                return;
            }

            let bestMove = null;
            if (aiDifficulty === 'hard') {
                let bestScore = -Infinity;
                possibleMoves.sort(() => Math.random() - 0.5);
                for (let move of possibleMoves) {
                    let tempBoard = cloneBoard(board);
                    applyMoveToTemp(tempBoard, move);
                    let score = minimax(tempBoard, 3, false, -Infinity, Infinity);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = move;
                    }
                }
            } else {
                bestMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }

            isAiThinking = false;
            if (bestMove) {
                let capturedObj = bestMove.captured;
                let wasCapture = capturedObj !== null;
                const piece = board[bestMove.fromR][bestMove.fromC];
                board[bestMove.fromR][bestMove.fromC] = 0;
                board[bestMove.r][bestMove.c] = piece;

                if (capturedObj) board[capturedObj.r][capturedObj.c] = 0;
                if (piece.player === 2 && bestMove.r === 7) piece.king = true;

                turn = 1;
                updateStatus();
                renderBoard();
                triggerGeminiCommentary(2, wasCapture, piece.king);

                let playerMoves = getAllPossibleMoves(1, board);
                if (playerMoves.length === 0) {
                    endGame("کۆمپیوتەر سەرکەوت! هەوڵ بدەرەوە.");
                }
            }
        }

        function applyMoveToTemp(b, move) {
            const piece = b[move.fromR][move.fromC];
            b[move.fromR][move.fromC] = 0;
            b[move.r][move.c] = piece;
            if (move.captured) b[move.captured.r][move.captured.c] = 0;
            if (piece.player === 1 && move.r === 0) piece.king = true;
            if (piece.player === 2 && move.r === 7) piece.king = true;
        }

        function minimax(b, depth, maximizingPlayer, alpha, beta) {
            if (depth === 0) return evaluateBoard(b);
            let currentPlayer = maximizingPlayer ? 2 : 1;
            let moves = getAllPossibleMoves(currentPlayer, b);
            if (moves.length === 0) return maximizingPlayer ? -10000 : 10000;

            if (maximizingPlayer) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    let nextB = cloneBoard(b);
                    applyMoveToTemp(nextB, move);
                    let evaluation = minimax(nextB, depth - 1, false, alpha, beta);
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    let nextB = cloneBoard(b);
                    applyMoveToTemp(nextB, move);
                    let evaluation = minimax(nextB, depth - 1, true, alpha, beta);
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluateBoard(b) {
            let score = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let p = b[r][c];
                    if (p !== 0) {
                        let val = 10;
                        if (p.king) val = 30;
                        if (p.player === 2) {
                            val += (r * 1.5);
                            score += val;
                        } else {
                            val += ((7 - r) * 1.5);
                            score -= val;
                        }
                    }
                }
            }
            return score;
        }

        async function triggerGeminiCommentary(player, wasCapture, isKing) {
            if (!apiKey) return;
            const aiCommentElement = document.getElementById('aiComment');
            aiCommentElement.innerText = "«مامە چایچی سەیری تەختەکە دەکات...»";

            let playerStr = player === 1 ? `${playerName} (${playerColor})` : 'کۆمپیوتەری زیرەک';
            let actionStr = wasCapture ? 'بەردێکی خوار!' : 'هەنگاوێکی نا.';
            if (isKing) actionStr += ' تاجدار بوو!';

            const prompt = `تۆ پیرەمەردێکی چایچییەکی کۆڕی دامەیت لە چایخانە. یاریزان: ${playerStr}. کردار: ${actionStr}. بە زمانی کوردی شیرین، ١ ڕستە قسەیەکی خۆش یان گاڵتەجاڕانە بڵێ وەک چای پێشکەش بکە.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiCommentElement.innerText = `"${data.candidates[0].content.parts[0].text.trim()}"`;
                }
            } catch (err) {
                aiCommentElement.innerText = "«یارییەکی نایابە!»";
            }
        }
    </script>
</body>
</html>
